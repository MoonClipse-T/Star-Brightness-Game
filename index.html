/* 8단원 별과 우주 — 공통 슬라이드 스타일
   검정 바탕 + 실제 천체 사진 + 강조색 하나(호박색). 그라데이션·글래스·네온·둥근 카드 금지. */
:root{
  --bg:#060607; --bg2:#0d0d0f; --ink:#edeae3; --mute:#9b978f; --dim:#5f5c56;
  --line:rgba(237,234,227,.16); --line2:rgba(237,234,227,.32);
  --acc:#f2a33a; --acc-ink:#140c02;
  --head:"Head","Malgun Gothic",sans-serif;
  --body:"Body","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--body);
  word-break:keep-all;overflow-wrap:break-word;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700;color:#fff}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;background:var(--bg);transform-origin:center center;overflow:hidden;flex:none}

/* ---------- slide ---------- */
.slide{position:absolute;inset:0;padding:112px 88px 72px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.slide.active{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s 0s;z-index:1}
[data-step]{opacity:0;transform:translateY(8px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
[data-step].on{opacity:1;transform:none}
[data-step].dimmed{opacity:.35}

/* ---------- chrome ---------- */
#chrome{position:absolute;inset:0;pointer-events:none;z-index:50}
#chrome .unit{position:absolute;left:88px;top:44px;font-size:15px;letter-spacing:.14em;color:var(--mute);display:flex;gap:14px;align-items:center}
#chrome .unit i{display:inline-block;width:28px;height:1px;background:var(--line2)}
#chrome .unit b{color:var(--ink);font-weight:700;letter-spacing:.06em}
#chrome .page{position:absolute;right:88px;top:44px;font-size:15px;letter-spacing:.14em;color:var(--mute);font-variant-numeric:tabular-nums}
#chrome .page b{color:var(--ink)}
#chrome .credit{position:absolute;left:88px;bottom:26px;font-size:12px;color:var(--dim);letter-spacing:.02em;max-width:900px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chrome .nav{position:absolute;right:76px;bottom:18px;display:flex;gap:2px;pointer-events:auto}
#chrome .nav button{width:44px;height:36px;border:0;background:transparent;color:var(--mute);font:16px var(--body);cursor:pointer}
#chrome .nav button:hover{color:var(--ink)}
#chrome .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);transition:width .35s var(--ease)}
#chrome .pager{display:none;position:absolute;left:50%;top:24px;translate:-50% 0;align-items:center;gap:6px;pointer-events:auto;background:rgba(6,6,7,.86);border:1px solid var(--line2);padding:6px}
#chrome .pager button{min-width:76px;height:64px;border:0;background:transparent;color:var(--ink);font:30px var(--body);padding:0 18px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
#chrome .pager button.end{font-size:22px;font-weight:700;color:var(--acc)}
#chrome .pager .dots{display:flex;gap:8px;padding:0 6px}
#chrome .pager .dots:empty{display:none}
#chrome .pager .dots i{width:11px;height:11px;border-radius:50%;background:var(--line2)}
#chrome .pager .dots i.on{background:var(--acc)}
.simslide #chrome .pager{display:flex}.simslide #chrome .nav,.solo #chrome .pager{display:none}
.slide.cover~#chrome .unit,.hide-chrome #chrome .unit,.hide-chrome #chrome .page{opacity:0}

/* ---------- type ---------- */
.kicker{font-size:17px;letter-spacing:.2em;color:var(--acc);font-weight:700;margin:0 0 18px}
.display{font-family:var(--head);font-size:168px;line-height:.98;letter-spacing:-.01em;margin:0;font-weight:normal}
h2{font-family:var(--head);font-size:70px;line-height:1.08;margin:0 0 28px;font-weight:normal;letter-spacing:-.005em}
h3{font-family:var(--head);font-size:42px;line-height:1.15;margin:0 0 14px;font-weight:normal}
.lead{font-size:32px;line-height:1.55;margin:0 0 22px;color:var(--ink)}
p{font-size:27px;line-height:1.62;margin:0 0 18px;color:#d9d6cf}
.small{font-size:21px;line-height:1.55;color:var(--mute)}
.micro{font-size:15px;letter-spacing:.08em;color:var(--mute)}
.acc{color:var(--acc)}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
hr.rule{border:0;border-top:1px solid var(--line);margin:28px 0}
mark{background:none;color:var(--acc);font-weight:700}

/* ---------- layout ---------- */
.row{display:flex;gap:56px}
.col{flex:1;min-width:0}
.split{display:grid;grid-template-columns:7fr 5fr;gap:64px;height:100%}
.split.rev{grid-template-columns:5fr 7fr}
.split.half{grid-template-columns:1fr 1fr}
.vcenter{display:flex;flex-direction:column;justify-content:center}
.bottom{display:flex;flex-direction:column;justify-content:flex-end}
.fill{position:absolute;inset:0}

/* ---------- photo ---------- */
.bleed{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#000}
.bleed img,.bleed video{width:100%;height:100%;object-fit:cover;display:block}
.bleed.scrim-l::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 70%)}
.bleed.scrim-b::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 40%,rgba(0,0,0,0) 65%)}
.bleed.scrim-r::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 40%,rgba(0,0,0,0) 72%)}
figure.ph{margin:0;position:relative;background:#000;overflow:hidden}
figure.ph img{display:block;width:100%;height:100%;object-fit:cover}
figure.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;font-size:16px;color:#cfccc5;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0))}
.tag{position:absolute;font-size:17px;color:#fff;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
.tag::before{content:"";position:absolute;left:-22px;top:50%;width:14px;height:1px;background:#fff}

/* ---------- term (사전식 정의) ---------- */
.term{border-top:1px solid var(--line2);padding-top:22px}
.term .w{font-family:var(--head);font-size:84px;line-height:1;margin:0 0 6px}
.term .en{font-size:18px;letter-spacing:.16em;color:var(--mute);margin-bottom:24px;text-transform:uppercase}
.term p{font-size:30px;color:var(--ink)}

/* ---------- big number ---------- */
.big{font-family:var(--head);font-size:220px;line-height:.9;letter-spacing:-.02em}
.unitlbl{font-size:24px;color:var(--mute);letter-spacing:.06em}

/* ---------- table ---------- */
table.data{border-collapse:collapse;width:100%;font-size:26px}
table.data th{font-weight:400;font-size:17px;letter-spacing:.12em;color:var(--mute);text-align:left;padding:0 18px 14px;border-bottom:1px solid var(--line2)}
table.data td{padding:20px 18px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.data td.n,table.data th.n{text-align:right}
table.data tr.hl td{color:var(--acc)}

/* ---------- check (이것만은) ---------- */
ol.check{list-style:none;counter-reset:q;padding:0;margin:0}
ol.check li{counter-increment:q;position:relative;padding:26px 0 26px 76px;border-top:1px solid var(--line);font-size:30px;line-height:1.6}
ol.check li::before{content:counter(q,decimal-leading-zero);position:absolute;left:0;top:22px;font-family:var(--head);font-size:40px;color:var(--acc)}
.blank{display:inline-block;min-width:150px;border-bottom:2px solid var(--line2);text-align:center;color:transparent;cursor:pointer;padding:0 10px;transition:color .2s}
.blank.show{color:var(--acc);border-color:var(--acc)}
.choice{display:inline-block;padding:0 6px;cursor:pointer;border-bottom:2px solid transparent}
.choice.show{color:var(--acc);border-color:var(--acc)}

/* ---------- sim ---------- */
.sim{position:absolute;inset:0;background:#000;overflow:hidden}
.sim canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.sim-host{position:relative;overflow:hidden;background:#000}
.hud{position:absolute;z-index:5;font-size:17px;color:var(--ink)}
.hud .lbl{font-size:14px;letter-spacing:.16em;color:var(--mute);margin-bottom:8px;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{border:0;border-right:1px solid var(--line2);background:rgba(0,0,0,.55);color:var(--ink);font:16px var(--body);padding:10px 18px;cursor:pointer;letter-spacing:.02em;min-height:44px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.btn{border:1px solid var(--line2);background:rgba(0,0,0,.55);color:var(--ink);font:16px var(--body);padding:10px 18px;cursor:pointer;min-height:44px}
.btn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;margin:0}
input[type=range].rng::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;background:var(--acc);border:0;border-radius:50%}
.readout{font-family:var(--head);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.readout small{font-family:var(--body);font-size:18px;color:var(--mute);margin-left:6px}
.panel{background:rgba(6,6,7,.78);border-left:2px solid var(--acc);padding:22px 26px}

/* ---------- overview ---------- */
#overview{position:absolute;inset:0;z-index:100;background:rgba(6,6,7,.97);display:none;padding:80px 88px;overflow:auto}
#overview.open{display:block}
#overview h4{font-family:var(--head);font-weight:normal;font-size:40px;margin:0 0 30px}
#overview ol{list-style:none;padding:0;margin:0;columns:3;column-gap:48px}
#overview li{break-inside:avoid;padding:12px 0;border-top:1px solid var(--line);font-size:20px;cursor:pointer;display:flex;gap:16px}
#overview li span{color:var(--dim);font-variant-numeric:tabular-nums;width:28px}
#overview li.cur{color:var(--acc)}

/* ---------- 3D 라벨 · 시뮬레이터 부품 ---------- */
.lbl3{position:absolute;left:0;top:0;font-size:17px;color:#fff;white-space:nowrap;transition:opacity .25s;letter-spacing:.02em;text-shadow:0 1px 3px #000,0 0 8px #000}
.lbl3.c{translate:-50% -50%}
.lbl3 span{color:var(--mute);margin-left:4px}
.lbl3.acc{color:var(--acc);font-weight:700}
.lbl3.blue{color:#b9c7ff}
.lbl3.tag-s{font-size:15px;margin:-26px 0 0 10px}
.lbl3.ghost{color:var(--mute)}
.tele{position:absolute;right:40px;top:40px;width:430px;height:360px;border:1px solid var(--line2);z-index:4;pointer-events:none}
.tele .cap{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:15px;background:rgba(6,6,7,.9);border-bottom:1px solid var(--line2)}
.tele .cap b{font-weight:700;letter-spacing:.04em}
.tele .cap span{color:var(--mute)}
.ctl{right:40px;bottom:40px;width:430px;background:rgba(6,6,7,.78);padding:18px 20px;border:1px solid var(--line)}
.ctl .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:-6px 2px 14px;font-style:normal}
.ctl .ticks i{font-style:normal;width:16px;text-align:center;white-space:nowrap}
.ctl .seg{margin-right:8px}
.ctl .mon{color:var(--acc);font-weight:700}
.capbox{position:absolute;left:88px;bottom:72px;width:560px;z-index:4}
.capbox h2{font-size:58px;margin-bottom:18px}
.capbox p{font-size:25px;line-height:1.6;color:#e2dfd8;margin:0 0 10px}
.capbox .stp{position:absolute;left:0;bottom:0;width:100%}
.exag{position:absolute;left:88px;top:76px;z-index:4;font-size:14px;color:var(--dim);letter-spacing:.06em}
.minimap{position:absolute;right:40px;top:40px;width:320px;background:rgba(6,6,7,.86);border:1px solid var(--line2);z-index:4;opacity:0;transition:opacity .3s;pointer-events:none}
.minimap.on{opacity:1}
.minimap .cap{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:15px;border-bottom:1px solid var(--line2)}
.minimap .cap .ang{color:var(--acc);font-weight:700}
.minimap svg{display:block;width:100%;height:auto}
.minimap .ln{stroke:rgba(237,234,227,.55);stroke-width:1.2;stroke-dasharray:4 4}
.minimap .arc{fill:rgba(242,163,58,.45);stroke:var(--acc);stroke-width:1}
.minimap .tr{fill:#5f8a3c;stroke:#cfe3b3;stroke-width:1.5}
.minimap .pt{fill:#2a2a2a;stroke:#edeae3;stroke-width:1.5}
.minimap .me{fill:var(--acc);stroke:#fff;stroke-width:1.5}
.minimap .t{fill:#cfccc5;font-size:15px;font-family:var(--body)}
.ctl.street{width:380px}
.eyetags{position:absolute;inset:0;display:none;pointer-events:none;z-index:3}
.dual .eyetags{display:block}
.eyetags span{position:absolute;top:34px;font-size:17px;letter-spacing:.08em;padding:6px 14px;background:rgba(6,6,7,.72);border-left:2px solid var(--acc)}
.eyetags span:first-child{left:40px}.eyetags span:last-child{left:calc(50% + 40px)}
.eyevig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 75% 80% at 50% 50%,transparent 58%,rgba(0,0,0,.42) 100%)}
.dual .eyevig{background:radial-gradient(ellipse 38% 80% at 25% 50%,transparent 58%,rgba(0,0,0,.4) 100%),radial-gradient(ellipse 38% 80% at 75% 50%,transparent 58%,rgba(0,0,0,.4) 100%)}
.capbox.panel{background:rgba(6,6,7,.86);padding:30px 34px 26px;left:40px;bottom:40px;width:600px;border-top:2px solid var(--acc)}

/* ---------- 01 거리 덱 부품 ---------- */
.goals .col{border-top:1px solid var(--line2);padding-top:18px;font-size:30px;display:flex;gap:18px;align-items:baseline}
.goals .num{font-size:26px;color:var(--acc)}
svg.diag{width:100%;height:auto;max-height:680px}
svg.diag .bg{stroke:rgba(237,234,227,.5);stroke-width:2;stroke-dasharray:6 6}
svg.diag .sl{stroke:rgba(237,234,227,.75);stroke-width:1.5}
svg.diag .sl2{stroke:rgba(185,199,255,.6);stroke-width:1.5}
svg.diag .a1{fill:rgba(242,163,58,.55)}
svg.diag .a2{fill:rgba(185,199,255,.5)}
svg.diag .ob{fill:var(--acc)} svg.diag .ob2{fill:#b9c7ff}
svg.diag .pt{fill:var(--bg);stroke:var(--ink);stroke-width:2}
svg.diag .t{fill:var(--ink);font-size:20px;font-family:var(--body)}
svg.diag .t2{fill:var(--mute);font-size:20px;font-family:var(--body);letter-spacing:.1em}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:16px 0 16px 52px;border-top:1px solid var(--line);font-size:24px;line-height:1.55;color:#dcd9d2}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:14px;font-family:var(--head);font-size:30px;color:var(--acc)}
.unitrow{display:flex;align-items:baseline;gap:26px;margin-bottom:6px}
.unitrow .big{font-size:150px}
.unitrow .eq{font-size:60px;color:var(--mute)}
.unitcol{padding-right:60px;border-left:1px solid var(--line2);padding-left:40px}
.unitcol:first-child{border-left:0;padding-left:0}
.unitcol .big{font-size:180px}
.eqbar{position:absolute;left:88px;right:88px;bottom:96px;border-top:1px solid var(--line2);padding-top:28px;display:flex;gap:30px;align-items:baseline;font-size:64px;font-family:var(--head)}
.blink{position:relative;aspect-ratio:1/1;max-height:700px;background:#000;border:1px solid var(--line)}
.blink img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .12s}
.blink .b1{opacity:0}
.blink.s1 .b1{opacity:1}
.blink .bl-cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;font-size:17px;background:rgba(0,0,0,.65)}
.blink .w1,.blink.s1 .w0{display:none}
.blink.s1 .w1{display:inline}
.blink .ring{position:absolute;left:38.6%;top:36.6%;width:14%;height:14%;border:2px solid var(--acc);border-radius:50%}
table.clickable tr[data-star]{cursor:pointer}
table.data tr.hl td{color:var(--acc)}
.lbl3.star{margin:-12px 0 0 16px;font-size:16px;line-height:1.35}
.lbl3.star b{display:block;font-size:19px}
.lbl3.star em{font-style:normal;color:var(--mute)}
.lbl3.star.hl b{color:var(--acc)}
.lbl3.ring{color:var(--dim);font-size:14px}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.plates figure{margin:0}
.plates canvas{display:block;width:100%;aspect-ratio:3/2;background:#000;border:1px solid var(--line)}
.plates figcaption{font-size:18px;color:var(--mute);margin-top:10px}
ol.check.qs{margin-top:22px}
ol.check.qs li{font-size:26px;padding:16px 0 16px 64px}
ol.check.qs li::before{font-size:30px;top:14px}
.sumcol{border-top:2px solid var(--acc);padding-top:22px}
.sumcol .num{font-size:28px;color:var(--acc);display:block;margin-bottom:10px}
.sumcol p{font-size:26px}
.sumcol .blank{min-width:110px}

/* ---------- 02 등급 덱 부품 ---------- */
.luxctl{width:400px;padding:14px 18px}
.luxctl .spreadb{width:100%}
.luxrec{right:40px;top:40px;width:470px;background:rgba(6,6,7,.8);border:1px solid var(--line);padding:12px 16px}
.luxrec .rhead{display:flex;justify-content:space-between;align-items:center}
.luxrec .rhead .lbl{margin:0}
.btn.mini{min-height:32px;padding:4px 12px;font-size:14px;margin-left:6px}
.luxrec table{margin-top:6px}
.luxrec .empty{font-size:15px;color:var(--mute);margin:8px 0 2px}
.luxrec.has .empty{display:none}
.luxrec:not(.has) table,.luxrec.folded table,.luxrec.folded .empty{display:none}
.capbox.panel.luxcap{left:40px;top:40px;bottom:auto;width:560px;padding:20px 24px 18px}
.luxcap h2{font-size:30px;margin:0 0 10px}
.luxcap p{font-size:19px;line-height:1.55;margin:0 0 6px}
.luxcap .stp{position:absolute;left:0;top:0;bottom:auto;width:100%}
.luxcap .blank{min-width:70px}
.luxctl .ticks{justify-content:space-between}
.luxctl .ticks i{width:auto}
.readrow{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 18px}
table.data.mini{font-size:18px}
table.data.mini th{font-size:13px;padding:0 8px 10px}
table.data.mini td{padding:10px 8px}
table.data.mini .blank{min-width:60px;font-size:18px}
.ticks.abs{position:relative;height:20px;display:block!important}
.ticks.abs i{position:absolute;transform:translateX(-50%);width:auto!important;white-space:nowrap}
.ticks.abs i:first-child{transform:none}.ticks.abs i:last-child{transform:translateX(-100%)}
.sunctl{width:560px}
.sunctl .two{display:flex;gap:40px;margin-bottom:14px}
.sunctl .readout{font-size:52px}
.glare{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,250,240,1) 0%,rgba(255,240,215,.9) 18%,rgba(255,226,180,.45) 42%,rgba(255,210,150,.12) 70%,rgba(0,0,0,0) 100%)}
.lbl3.inv{font-size:17px;line-height:1.4;text-align:center}
.lbl3.inv b{display:block;font-size:22px}
.lbl3.inv em{font-style:normal;color:var(--mute)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.8em;line-height:1;text-align:center;margin:0 2px}
.frac i{font-style:normal}.frac i:first-child{border-bottom:1px solid currentColor;padding:0 2px 1px}
.tele.seen{width:460px;height:300px}
.tele.seen canvas{display:block;width:100%;height:calc(100% - 40px)}
.tenctl{right:40px;bottom:40px;width:auto;padding:14px}
.lbl3.tenlbl{text-align:center;line-height:1.35;font-size:16px}
.lbl3.tenlbl b{display:block;font-size:21px}
.lbl3.tenlbl em{font-style:normal;color:var(--mute);display:block}
.lbl3.tenlbl strong{color:var(--acc);font-family:var(--head);font-size:24px;font-weight:400}
.lbl3.big{font-family:var(--head);font-size:30px}

.arrive{opacity:0;transition:opacity .4s}.arrive.on{opacity:1}
.sunmark{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;opacity:0}.sunmark i{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:1.5px solid var(--acc);border-radius:50%}.sunmark span{position:absolute;left:30px;top:-34px;color:var(--acc);font-size:18px;white-space:nowrap}
.galctl{width:auto;padding:14px;display:flex;gap:10px;align-items:center}
.lbl3.gl{color:#cfd8ff;font-size:16px}
.lbl3.tagbg{background:rgba(0,0,0,.72);padding:3px 9px;font-weight:700}
.orbctl{width:520px}
.orbctl .chips{display:flex;flex-wrap:wrap;gap:6px}
.orbctl .chip{font-size:15px;min-height:38px;padding:6px 12px}
.lbl3.sat{margin:-10px 0 0 14px;font-size:16px;font-weight:700}
.solohead{position:absolute;left:56px;top:48px;z-index:4;max-width:560px;pointer-events:none}
.solohead h2{font-size:52px;margin-bottom:10px}
.solohead p{font-size:22px;color:var(--mute)}
.solo #chrome .nav{display:none}
/* 탐구 3D · 시차 측정 모형판 */
.peep{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 33%,rgba(4,4,5,.55) 35.5%,#040405 38%)}
.peep.on{opacity:1}
.peep span{position:absolute;left:50%;top:116px;translate:-50% 0;font-size:17px;letter-spacing:.1em;color:var(--mute)}
.ctl.board{width:430px}
.ctl .hint{font-size:15px;line-height:1.5;color:var(--mute);margin:14px 0 0;transition:opacity .3s}
.ctl .hint b{color:var(--ink)}
.rec{right:40px;top:40px;width:430px;background:rgba(6,6,7,.82);border:1px solid var(--line);padding:16px 20px}
.rec table{width:100%;border-collapse:collapse;font-size:18px}
.rec th{font-weight:400;color:var(--mute);font-size:14px;text-align:center;padding:4px 0 8px;border-bottom:1px solid var(--line2)}
.rec td{text-align:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rec td:first-child{text-align:left;white-space:nowrap}
.rec td i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.rec td.d{color:var(--acc);font-weight:700}
.board-cap{width:620px}
.board-cap .stp{top:0;bottom:auto}
/* 시차 측정 모형판 — 학생 혼자 하기 (boardGame) */
.misbox{left:40px;bottom:40px;width:430px;background:rgba(6,6,7,.8);border:1px solid var(--line);padding:16px 20px}
.mis{list-style:none;margin:0;padding:0;counter-reset:m}
.mis li{counter-increment:m;position:relative;padding:8px 0 8px 40px;font-size:16px;line-height:1.5;color:var(--dim);border-bottom:1px solid var(--line);transition:color .3s}
.mis li:last-child{border-bottom:0}
.mis li::before{content:counter(m);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);text-align:center;line-height:25px;font-size:14px;color:var(--mute)}
.mis li.now{color:var(--ink)}
.mis li.now::before{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 4px rgba(242,163,58,.18)}
.mis li.done{color:var(--mute)}
.mis li.done::before{content:'✓';background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.mis b{color:inherit}.mis .rd{color:#e8695a}.mis .yl{color:#e9c548}
.ctl.board.free{width:430px}
.ctl.board.free .seg button{min-width:100px}
.rec td.ok{color:#6fd39a}.rec td.ok::after{content:' ✓'}
.rec td.no{color:#e8695a}.rec td.no::after{content:' ✗'}
.rec .res{font-size:15px;line-height:1.5;color:var(--mute);margin:10px 0 0;min-height:1em}
.rec .quiz{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.rec .quiz p{margin:0 0 10px;font-size:17px}
.rec .quiz .qa{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--mute)}
.rec .quiz .qa b{color:var(--acc)}
.misbox.peek li:not(.now){display:none}
.misbox.peek li.now{border-bottom:0}
table.cmp{font-size:20px;margin:0}
table.cmp td{padding:10px 14px}
table.cmp td:last-child{width:150px;text-align:center}
/* 뉴호라이즌스 3D + 실제 사진 */
